apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/milnesiidae/ostinato-infra.git
    targetRevision: main
    path: argocd/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  project: infra
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
  ignoreDifferences:
  - kind: Secret
    name: argocd-secret
    namespace: argocd
    jsonPointers:
    - /data
