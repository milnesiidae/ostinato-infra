apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-operator
  namespace: argocd
spec:
  source:
    chart: gpu-operator
    repoURL: https://helm.ngc.nvidia.com/nvidia
    targetRevision: 26.7.0
    helm:
      parameters:
      - name: driver.enabled
        value: "false"
      - name: toolkit.enabled
        value: "false"
      - name: hostPaths.driverInstallDir
        value: /usr/local
      - name: devicePlugin.config.create
        value: "true"
      - name: devicePlugin.config.name
        value: time-slicing-config-all
      - name: devicePlugin.config.default
        value: default
      - name: devicePlugin.config.data.default
        value: |
          version: v1
          flags:
            migStrategy: none
          sharing:
            timeSlicing:
              resources:
              - name: nvidia.com/gpu
                replicas: 10
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gpu-operator
  project: infra
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
