apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/milnesiidae/ostinato-infra.git
    targetRevision: main
    path: nvidia-device-plugin/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  project: infra
  syncPolicy:
    automated: {}
    syncOptions:
    - ServerSideApply=true
