
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: ostinato-dns
data:
  Corefile: |
    .:53 {
        bind {$NODE_IP}
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }

        rewrite name suffix ostinato svc.cluster.local
        forward svc.cluster.local kube-dns.kube-system.svc.cluster.local {
           max_concurrent 1000
        }
        forward . 8.8.8.8 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
